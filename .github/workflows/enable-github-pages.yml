name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from main root with custom domain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Attempting to create Pages site (main /)..."
          if gh api --method POST "repos/${GH_REPO}/pages" \
            -H "Accept: application/vnd.github+json" \
            -f "build_type=legacy" \
            -f "source[branch]=main" \
            -f "source[path]=/" \
            -f "cname=fuquayfencingpros.com"; then
            echo "Pages site created."
          else
            echo "Create returned non-zero; updating existing site."
          fi
          echo "Updating Pages source and custom domain..."
          gh api --method PUT "repos/${GH_REPO}/pages" \
            -H "Accept: application/vnd.github+json" \
            -f "build_type=legacy" \
            -f "source[branch]=main" \
            -f "source[path]=/" \
            -f "cname=fuquayfencingpros.com"
          echo "Final Pages configuration:"
          gh api "repos/${GH_REPO}/pages"
